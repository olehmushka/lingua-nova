{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}Rifatian dictionary{{end}}</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 0 auto; padding: 1rem; color: #222; background: #fff; }
  a { color: #1a5fb4; }
  header { display: flex; gap: 1rem; align-items: baseline; border-bottom: 1px solid #ddd; margin-bottom: 1rem; }
  header a { font-weight: bold; text-decoration: none; color: inherit; }
  input[type=search] { font: inherit; padding: .3rem .5rem; width: min(24rem, 100%); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .25rem .6rem .25rem 0; vertical-align: top; }
  th { font-weight: normal; color: #666; }
  .ipa, .muted { color: #666; }
  .proto { font-style: italic; }
  .bad { color: #b00; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
  dt { color: #666; }
  dd { margin: 0; }
</style>
</head>
<body>
<header><a href="/">rifacha</a><span class="muted">Rifatian dictionary</span></header>
{{template "content" .}}
</body>
</html>{{end}}
