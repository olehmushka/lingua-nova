# Eval sentences for `lnova eval`: English the LLM translates, several
# runs each, to measure a pass rate per setup. A pass is an answer the
# checker accepts (form and meaning, see internal/llm). Hand-edited;
# the Go code only reads it.
#
# Fields: en (the sentence), tags (what it tests; `lnova eval -tag T`
# runs only those). Every content word must be in the lexicon.
#
# Tags: present past future · negation yes-no wh-subject wh-object
# wh-adverb · possessive adjective plural pronoun archaic · copula
# preposition clause · known-hard (failed in earlier measurements) ·
# pp-pronoun (the pronoun-after-preposition sentences) · dative (gave
# me bread: no "to") · unseen (added 2026-10-28; not in grammar.md, so
# the model can't copy them from the prompt) ·
# frame (the 6 copula / preposition sentences; their baseline is
# evals/results/2026-10-22-frame-*.json).

# The 7 sentences of the 2026-10-18 tool-use measurement.
- en: The woman sees the river.
  tags: [present]
- en: The men will drink the water.
  tags: [future, plural]
- en: Didst thou see the woman's dog?
  tags: [past, yes-no, possessive, archaic, pronoun]
- en: The dog eats the bread.
  tags: [present, known-hard]
- en: She didn't see the big house.
  tags: [past, negation, adjective, pronoun]
- en: Who saw the men?
  tags: [past, wh-subject, plural]
- en: We will love the god.
  tags: [future, pronoun]

# Every feature the rule-based grammar handles, again.
- en: The children sleep.
  tags: [present, plural]
- en: The old king built a fortress.
  tags: [past, adjective]
- en: I know the priest.
  tags: [present, pronoun]
- en: They will not eat the meat.
  tags: [future, negation, pronoun]
- en: Did the farmer sell the wine?
  tags: [past, yes-no]
- en: What did the woman find?
  tags: [past, wh-object]
- en: Where did you see the stranger?
  tags: [past, wh-adverb, pronoun]
- en: Why did the child run?
  tags: [past, wh-adverb]
- en: My mother sings.
  tags: [present, possessive]
- en: The shepherd carried the small child.
  tags: [past, adjective]
- en: The friends hear the thunder.
  tags: [present, plural]
- en: Who will help the old man?
  tags: [future, wh-subject, adjective]
- en: You drank the cold milk.
  tags: [past, adjective, pronoun]
- en: The king was a warrior.
  tags: [past, copula, frame]

# The copula, prepositions, "of" and subordinate clauses. Until
# 2026-10-22 the English grammar had no tree for these, so they got only
# the lexical check; results before then aren't comparable for them.
- en: The warrior's sword is long.
  tags: [present, possessive, adjective, copula, frame]
- en: The children of the king sleep in the house.
  tags: [present, plural, possessive, preposition, frame]
- en: The birds fly over the mountain.
  tags: [present, plural, preposition, frame]
- en: I think that the river is cold.
  tags: [present, pronoun, copula, clause, frame]
- en: The woman gave bread to the child.
  tags: [past, preposition, frame]

# A pronoun after a preposition is in the object form (decided
# 2026-10-25). Baseline: evals/results/2026-10-27-pp-pronoun.json.
- en: She sleeps with him.
  tags: [present, pronoun, preposition, pp-pronoun]
- en: The woman gave bread to me.
  tags: [past, pronoun, preposition, pp-pronoun]

# The same rules on sentences that aren't in grammar.md (2026-10-28):
# the 2 above are worked examples there, and the whole grammar is in
# the prompt, so the model could copy them.
- en: He sleeps with her.
  tags: [present, pronoun, preposition, pp-pronoun, unseen]
- en: The man gave water to us.
  tags: [past, pronoun, preposition, pp-pronoun, unseen]
- en: The man gave the child water.
  tags: [past, dative, unseen]
