# A context-free grammar for the English the translator accepts, parsed
# with Earley's algorithm (internal/earley). One rule per line, | between
# alternatives, # starts a comment. The first rule's left side (S) is the
# start symbol.
#
# Preterminals (the categories in english/words.yaml or from the tagger):
#   N V Adj        open-class words
#   Det Poss Pron  the/a/this, my/her/your, I/you/them
#   Gen            possessive 's
#   Aux Neg        do/did/will, not/n't
#   WhP WhAdv      who/what, where/when/how/why
#
# The translator relies on the nonterminal names (NP, Pred, VP, Gap…), so
# rename them only together with internal/translate.

S      -> NP Pred                # The woman sees the river.
S      -> YN                     # Did you see the dog?
S      -> WhAdv YN               # Where did you see the dog?
S      -> WhP Pred               # Who saw the dog?            (subject question)
S      -> WhP Gap                # What did you see?           (object question)

# Yes/no questions: English inverts the auxiliary and the subject.
YN     -> Aux NP VP | Aux Neg NP VP | Aux NP Neg VP

# An object question: the object has moved to the front, so the verb
# phrase has a gap where it was.
Gap    -> Aux NP V | Aux Neg NP V | Aux NP Neg V

# The predicate: a finite verb (sees, saw), or an auxiliary with a bare
# verb (will see, didn't see).
Pred   -> VP | Aux VP | Aux Neg VP
VP     -> V | V NP

NP     -> Det Nom                # the big dog
NP     -> Nom                    # dogs, water
NP     -> Poss Nom               # my house
NP     -> NP Gen Nom             # the woman's dog (left recursive: the woman's dog's bone)
NP     -> Pron                   # she, them, nothing
Nom    -> Adj Nom | N
