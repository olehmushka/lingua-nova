[project]
name = "lingua-nova-llm"
version = "0.1.0"
description = "Local LLM service for lingua-nova: one translation attempt per request, via Ollama."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "ollama>=0.4",
    "pydantic>=2.9",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
